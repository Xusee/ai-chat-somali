<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Chat Somali - Kaaliyahaaga caqliga macmalka ah"
    >

    <title>AI Chat Somali</title>

    <style>

        :root {
            --primary: #10a37f;
            --primary-dark: #0d8a6c;
            --dark: #202123;
            --sidebar: #171717;
            --bg: #f7f7f8;
            --white: #ffffff;
            --border: #e5e5e5;
            --text: #202123;
            --muted: #6b7280;
            --danger: #dc3545;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }


        /* ==============================
           APP
        ============================== */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }


        /* ==============================
           SIDEBAR
        ============================== */

        .sidebar {
            width: 270px;
            background: var(--sidebar);
            color: white;

            display: flex;
            flex-direction: column;

            padding: 15px;

            flex-shrink: 0;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: bold;

            padding: 10px 5px 20px;
        }


        .brand-icon {
            width: 38px;
            height: 38px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--primary);
        }


        .new-chat-btn {
            width: 100%;

            border: 1px solid #555;
            background: transparent;

            color: white;

            padding: 13px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            margin-bottom: 15px;

            transition: 0.2s;
        }


        .new-chat-btn:hover {
            background: #2a2a2a;
        }


        .history-title {
            font-size: 12px;
            color: #999;

            margin: 10px 5px;
        }


        #chatList {
            flex: 1;

            overflow-y: auto;

            display: flex;
            flex-direction: column;

            gap: 5px;
        }


        .chat-history-item {
            padding: 12px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            transition: 0.2s;
        }


        .chat-history-item:hover {
            background: #2a2a2a;
        }


        .sidebar-bottom {
            padding-top: 10px;

            border-top: 1px solid #333;
        }


        .delete-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #4a1f25;
            color: white;

            font-size: 14px;
        }


        .delete-btn:hover {
            background: var(--danger);
        }


        /* ==============================
           MAIN CHAT
        ============================== */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;
        }


        /* ==============================
           HEADER
        ============================== */

        .header {
            height: 65px;

            background: white;

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }


        .header-title h1 {
            font-size: 19px;
        }


        .header-title p {
            color: var(--muted);
            font-size: 12px;

            margin-top: 3px;
        }


        .dark-btn {
            border: 1px solid var(--border);

            background: white;

            padding: 9px 12px;

            border-radius: 8px;

            cursor: pointer;
        }


        /* ==============================
           MESSAGES
        ============================== */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 30px 15%;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }


        .welcome {
            text-align: center;

            margin: auto;

            max-width: 650px;
        }


        .welcome h2 {
            font-size: 30px;

            margin-bottom: 12px;
        }


        .welcome p {
            color: var(--muted);

            line-height: 1.6;
        }


        .message {
            width: 100%;

            display: flex;
        }


        .user-message {
            justify-content: flex-end;
        }


        .ai-message {
            justify-content: flex-start;
        }


        .message-content {
            max-width: 75%;

            padding: 14px 17px;

            border-radius: 15px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;
        }


        .user-message .message-content {
            background: var(--primary);

            color: white;

            border-bottom-right-radius: 3px;
        }


        .ai-message .message-content {
            background: white;

            border: 1px solid var(--border);

            border-bottom-left-radius: 3px;
        }


        /* ==============================
           INPUT
        ============================== */

        .input-area {
            background: white;

            padding: 18px 15% 25px;

            border-top: 1px solid var(--border);
        }


        .input-box {
            max-width: 900px;

            margin: auto;

            display: flex;

            align-items: flex-end;

            gap: 10px;

            background: white;

            border: 1px solid #d1d1d1;

            border-radius: 15px;

            padding: 8px 10px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }


        #messageInput {
            flex: 1;

            resize: none;

            border: none;

            outline: none;

            font-size: 16px;

            font-family: inherit;

            padding: 10px;

            min-height: 45px;

            max-height: 150px;
        }


        #sendBtn {
            width: 48px;
            height: 48px;

            border: none;

            border-radius: 11px;

            background: var(--primary);

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        #sendBtn:hover {
            background: var(--primary-dark);
        }


        #sendBtn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        .input-note {
            text-align: center;

            color: #888;

            font-size: 12px;

            margin-top: 10px;
        }


        /* ==============================
           DARK MODE
        ============================== */

        body.dark-mode {
            --bg: #202123;
            --white: #2b2c2f;
            --border: #444;
            --text: #ffffff;
            --muted: #aaa;
        }


        body.dark-mode .header {
            background: #202123;
        }


        body.dark-mode .input-area {
            background: #202123;
        }


        body.dark-mode .input-box {
            background: #2b2c2f;

            border-color: #555;
        }


        body.dark-mode #messageInput {
            background: #2b2c2f;

            color: white;
        }


        body.dark-mode .ai-message .message-content {
            background: #2b2c2f;

            border-color: #444;
        }


        body.dark-mode .dark-btn {
            background: #2b2c2f;

            color: white;

            border-color: #555;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 768px) {

            .sidebar {
                width: 70px;

                padding: 10px;
            }


            .brand span,
            .history-title,
            .chat-history-item,
            .delete-btn {
                display: none;
            }


            .brand {
                justify-content: center;
            }


            .new-chat-btn {
                font-size: 0;

                height: 48px;
            }


            .new-chat-btn::after {
                content: "＋";

                font-size: 25px;
            }


            .messages {
                padding: 20px 15px;
            }


            .input-area {
                padding: 12px 15px 20px;
            }


            .header {
                padding: 0 15px;
            }


            .header-title h1 {
                font-size: 16px;
            }


            .message-content {
                max-width: 90%;
            }


            .welcome h2 {
                font-size: 24px;
            }

        }


    </style>

</head>


<body>


    <!-- =================================
         APP - LOGIN MA JIRO
    ================================== -->

    <div class="app" id="app">


        <!-- SIDEBAR -->

        <aside class="sidebar">


            <div class="brand">

                <div class="brand-icon">
                    🤖
                </div>

                <span>
                    AI Chat Somali
                </span>

            </div>


            <button
                class="new-chat-btn"
                id="newChatBtn"
            >
                ＋ Chat Cusub
            </button>


            <div class="history-title">
                TAARIIKHDA CHAT-KA
            </div>


            <div id="chatList">

            </div>


            <div class="sidebar-bottom">

                <button
                    class="delete-btn"
                    id="deleteAllBtn"
                >
                    🗑️ Tirtir Chat-yada
                </button>

            </div>


        </aside>



        <!-- MAIN -->

        <main class="main">


            <!-- HEADER -->

            <header class="header">


                <div class="header-title">

                    <h1>
                        🤖 AI Chat Somali
                    </h1>

                    <p>
                        Kaaliyahaaga Caqliga Macmalka ah
                    </p>

                </div>


                <button
                    class="dark-btn"
                    onclick="toggleDarkMode()"
                    title="Beddel muuqaalka"
                >
                    🌙
                </button>


            </header>



            <!-- MESSAGES -->

            <section
                class="messages"
                id="messages"
            >


                <div class="welcome">

                    <h2>
                        Ku soo dhowow AI Chat Somali 👋
                    </h2>


                    <p>
                        Weydii su'aal kasta oo aad rabto.
                        AI Chat Somali wuxuu isku dayayaa
                        inuu ku siiyo jawaab waxtar leh.
                    </p>


                </div>


            </section>



            <!-- INPUT -->

            <div class="input-area">


                <div class="input-box">


                    <textarea
                        id="messageInput"
                        placeholder="Ku qor fariintaada halkan..."
                        rows="1"
                    ></textarea>


                    <button
                        id="sendBtn"
                        title="Dir fariinta"
                    >
                        ➤
                    </button>


                </div>


                <div class="input-note">

                    AI Chat Somali wuu khaldi karaa.
                    Hubi macluumaadka muhiimka ah.

                </div>


            </div>


        </main>


    </div>



    <!-- APP JAVASCRIPT -->

    <script src="/app.js"></script>


</body>

</html>
