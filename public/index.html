<!DOCTYPE html>
<html lang="so">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NASIIB BUSINESS CENTER - Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172033;
}

header {
    background: #0f172a;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.07);
}

input,
textarea,
button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border-radius: 9px;
    border: 1px solid #ddd;
    font-size: 15px;
}

button {
    background: #0284c7;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.danger {
    background: #dc2626;
}

.gray {
    background: #475569;
}

.green {
    background: #16a34a;
}

#adminPanel {
    display: none;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tabs button {
    width: auto;
    min-width: 130px;
}

.status {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
}

.status.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.status.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
    vertical-align: top;
}

th {
    background: #f8fafc;
}

.chat {
    background: #f8fafc;
    border-radius: 10px;
    padding: 15px;
    margin: 10px 0;
}

.chat img {
    max-width: 250px;
    max-height: 250px;
    border-radius: 10px;
    margin-top: 10px;
}

.small {
    color: #64748b;
    font-size: 13px;
}

.action-btn {
    width: auto;
    padding: 8px 12px;
    margin-right: 5px;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width:700px) {

    header {
        padding: 15px;
    }

    header h1 {
        font-size: 19px;
    }

    .container {
        padding: 10px;
    }

    .card {
        padding: 15px;
    }

    table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
        font-size: 13px;
    }

    th,
    td {
        padding: 7px;
    }

    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .tabs button {
        width: 100%;
    }

}

</style>

</head>

<body>

<header>

<h1>🤖 NASIIB BUSINESS CENTER</h1>

</header>


<div class="container">


<!-- ================================================= -->
<!-- STATUS -->
<!-- ================================================= -->

<div
    id="statusBox"
    class="status"
></div>


<!-- ================================================= -->
<!-- LOGIN -->
<!-- ================================================= -->

<div
    id="loginPanel"
    class="card"
>

<h2>🔐 Admin Login</h2>

<p>
    Fadlan geli xogta Admin-ka.
</p>

<form id="adminLoginForm">

<input
    id="adminEmail"
    type="email"
    placeholder="Admin Email"
    autocomplete="username"
    required
>

<input
    id="adminPassword"
    type="password"
    placeholder="Admin Password"
    autocomplete="current-password"
    required
>

<button
    id="loginButton"
    type="submit"
>
    🔐 Gal Admin
</button>

</form>

</div>


<!-- ================================================= -->
<!-- ADMIN PANEL -->
<!-- ================================================= -->

<div
    id="adminPanel"
>


<div class="card">

<h2>👑 Admin Dashboard</h2>

<p>
    Ku soo dhowow Admin.
</p>

<button
    id="logoutBtn"
    class="gray"
>
    🚪 Ka bax
</button>

</div>


<!-- ================================================= -->
<!-- TABS -->
<!-- ================================================= -->

<div class="card">

<div class="tabs">

<button
    id="usersBtn"
>
    👥 Users
</button>

<button
    id="chatsBtn"
>
    💬 Chat History
</button>

<button
    id="knowledgeBtn"
>
    🧠 Knowledge
</button>

<button
    id="deleteAllChatsBtn"
    class="danger"
>
    🗑️ Delete All Chats
</button>

</div>

</div>


<!-- ================================================= -->
<!-- USERS -->
<!-- ================================================= -->

<div
    id="usersPanel"
    class="card"
>

<h2>👥 Users</h2>

<div id="usersList">

<div class="loading">
    Loading...
</div>

</div>

</div>


<!-- ================================================= -->
<!-- CHATS -->
<!-- ================================================= -->

<div
    id="chatsPanel"
    class="card"
>

<h2>💬 Chat History</h2>

<div id="chatsList">

<div class="loading">
    Loading...
</div>

</div>

</div>


<!-- ================================================= -->
<!-- KNOWLEDGE -->
<!-- ================================================= -->

<div
    id="knowledgePanel"
    class="card"
>

<h2>🧠 Ku dar Knowledge</h2>

<form id="knowledgeForm">

<input
    id="knowledgeTitle"
    placeholder="Cinwaan"
    required
>

<textarea
    id="knowledgeContent"
    rows="8"
    placeholder="Qoraalka knowledge-ka..."
    required
></textarea>

<button
    type="submit"
>
    💾 Kaydi Knowledge
</button>

</form>

<hr>

<div id="knowledgeList">

<div class="loading">
    Loading...
</div>

</div>

</div>


</div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API = window.location.origin;

const TOKEN_KEY = "adminToken";

let adminToken = localStorage.getItem(TOKEN_KEY);


/* =====================================================
   ELEMENTS
===================================================== */

const loginPanel =
    document.getElementById("loginPanel");

const adminPanel =
    document.getElementById("adminPanel");

const loginForm =
    document.getElementById("adminLoginForm");

const loginButton =
    document.getElementById("loginButton");

const statusBox =
    document.getElementById("statusBox");

const usersList =
    document.getElementById("usersList");

const chatsList =
    document.getElementById("chatsList");

const knowledgeList =
    document.getElementById("knowledgeList");

const knowledgeForm =
    document.getElementById("knowledgeForm");


/* =====================================================
   STATUS
===================================================== */

function showStatus(message, type = "error") {

    if (!statusBox) return;

    statusBox.textContent = message;

    statusBox.className =
        `status ${type}`;
}


function clearStatus() {

    if (!statusBox) return;

    statusBox.textContent = "";

    statusBox.className = "status";
}


/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders(includeJSON = false) {

    const headers = {
        "Authorization": `Bearer ${adminToken}`
    };

    if (includeJSON) {

        headers["Content-Type"] =
            "application/json";
    }

    return headers;
}


/* =====================================================
   RESPONSE HANDLER
===================================================== */

async function getResponseData(response) {

    const text = await response.text();

    if (!text) {
        return {};
    }

    try {

        return JSON.parse(text);

    } catch {

        return {
            error:
                text ||
                "Server-ku jawaab sax ah ma soo celin."
        };
    }
}


/* =====================================================
   LOGIN
===================================================== */

if (loginForm) {

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            clearStatus();

            const email =
                document
                    .getElementById("adminEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;

            if (!email || !password) {

                showStatus(
                    "Fadlan geli email iyo password."
                );

                return;
            }

            try {

                loginButton.disabled = true;

                loginButton.textContent =
                    "⏳ Galaya...";

                const response =
                    await fetch(
                        `${API}/api/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    email,
                                    password
                                })
                        }
                    );

                const data =
                    await getResponseData(
                        response
                    );

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        `Login error: ${response.status}`
                    );
                }

                if (!data.token) {

                    throw new Error(
                        "Token lama helin."
                    );
                }

                if (
                    !data.user ||
                    data.user.role !== "admin"
                ) {

                    throw new Error(
                        "Account-kan Admin ma aha."
                    );
                }

                adminToken =
                    data.token;

                localStorage.setItem(
                    TOKEN_KEY,
                    adminToken
                );

                showAdmin();

                showStatus(
                    "✅ Admin si guul leh ayuu u galay.",
                    "success"
                );

                await loadUsers();
                await loadChats();
                await loadKnowledge();

            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );

                showStatus(
                    error.message ||
                    "Server error."
                );

            } finally {

                loginButton.disabled = false;

                loginButton.textContent =
                    "🔐 Gal Admin";
            }
        }
    );
}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin() {

    if (loginPanel) {

        loginPanel.style.display =
            "none";
    }

    if (adminPanel) {

        adminPanel.style.display =
            "block";
    }
}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    if (loginPanel) {

        loginPanel.style.display =
            "block";
    }

    if (adminPanel) {

        adminPanel.style.display =
            "none";
    }
}


/* =====================================================
   VERIFY ADMIN
===================================================== */

async function verifyAdmin() {

    if (!adminToken) {

        showLogin();

        return false;
    }

    try {

        const response =
            await fetch(
                `${API}/api/admin/me`,
                {
                    method: "GET",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Admin verification failed."
            );
        }

        if (
            !data.user ||
            data.user.role !== "admin"
        ) {

            throw new Error(
                "Admin access ayaa loo baahan yahay."
            );
        }

        showAdmin();

        return true;

    } catch (error) {

        console.error(
            "VERIFY ADMIN ERROR:",
            error
        );

        localStorage.removeItem(
            TOKEN_KEY
        );

        adminToken = null;

        showLogin();

        return false;
    }
}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers() {

    if (!adminToken) return;

    usersList.innerHTML =
        `
        <div class="loading">
            ⏳ Users loading...
        </div>
        `;

    try {

        const response =
            await fetch(
                `${API}/api/admin/users`,
                {
                    method: "GET",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Users lama soo qaadi karin."
            );
        }

        if (
            !Array.isArray(data.users) ||
            data.users.length === 0
        ) {

            usersList.innerHTML =
                "👤 Users ma jiraan.";

            return;
        }

        usersList.innerHTML = `

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Magac</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Chats</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody>

                    ${data.users.map(user => `

                        <tr>

                            <td>
                                ${user.id}
                            </td>

                            <td>
                                ${escapeHTML(user.name)}
                            </td>

                            <td>
                                ${escapeHTML(user.email)}
                            </td>

                            <td>
                                ${
                                    user.role === "admin"
                                    ? "👑 Admin"
                                    : "👤 User"
                                }
                            </td>

                            <td>
                                ${user.chat_count || 0}
                            </td>

                            <td>

                                ${
                                    user.role !== "admin"
                                    ?

                                    `
                                    <button
                                        class="action-btn"
                                        onclick="deleteUserChats(${user.id})"
                                    >
                                        🗑️ Chats
                                    </button>

                                    <button
                                        class="action-btn danger"
                                        onclick="deleteUser(${user.id})"
                                    >
                                        ❌ User
                                    </button>
                                    `

                                    :

                                    "👑"
                                }

                            </td>

                        </tr>

                    `).join("")}

                </tbody>

            </table>
        `;

    } catch (error) {

        console.error(
            "LOAD USERS ERROR:",
            error
        );

        usersList.innerHTML =
            `
            ❌ Users lama soo qaadi karin.
            <br>
            <small>
                ${escapeHTML(error.message)}
            </small>
            `;
    }
}


/* =====================================================
   LOAD CHATS
===================================================== */

async function loadChats() {

    if (!adminToken) return;

    chatsList.innerHTML =
        `
        <div class="loading">
            ⏳ Chats loading...
        </div>
        `;

    try {

        const response =
            await fetch(
                `${API}/api/admin/chats`,
                {
                    method: "GET",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Chats lama soo qaadi karin."
            );
        }

        if (
            !Array.isArray(data.chats) ||
            data.chats.length === 0
        ) {

            chatsList.innerHTML =
                "💬 Chat history ma jiro.";

            return;
        }

        chatsList.innerHTML =
            data.chats.map(
                chat => `

                <div class="chat">

                    <strong>
                        👤 ${escapeHTML(
                            chat.name
                        )}
                    </strong>

                    <div class="small">
                        ${escapeHTML(
                            chat.email
                        )}
                    </div>

                    <hr>

                    <strong>
                        Su'aal:
                    </strong>

                    <p>
                        ${escapeHTML(
                            chat.message
                        )}
                    </p>

                    <strong>
                        🤖 AI:
                    </strong>

                    <p>
                        ${escapeHTML(
                            chat.response
                        )}
                    </p>

                    ${
                        chat.image
                        ?

                        `
                        <img
                            src="${escapeHTML(
                                chat.image
                            )}"
                            alt="User image"
                        >
                        `

                        :

                        ""
                    }

                    <div class="small">
                        ${formatDate(
                            chat.created_at
                        )}
                    </div>

                </div>

                `
            ).join("");

    } catch (error) {

        console.error(
            "LOAD CHATS ERROR:",
            error
        );

        chatsList.innerHTML =
            `
            ❌ Chats lama soo qaadi karin.
            <br>
            <small>
                ${escapeHTML(error.message)}
            </small>
            `;
    }
}


/* =====================================================
   LOAD KNOWLEDGE
===================================================== */

async function loadKnowledge() {

    if (!adminToken) return;

    knowledgeList.innerHTML =
        `
        <div class="loading">
            ⏳ Knowledge loading...
        </div>
        `;

    try {

        const response =
            await fetch(
                `${API}/api/admin/knowledge`,
                {
                    method: "GET",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Knowledge lama soo qaadi karin."
            );
        }

        if (
            !Array.isArray(data.knowledge) ||
            data.knowledge.length === 0
        ) {

            knowledgeList.innerHTML =
                "🧠 Knowledge ma jiro.";

            return;
        }

        knowledgeList.innerHTML =
            data.knowledge.map(
                item => `

                <div class="chat">

                    <h3>
                        🧠 ${escapeHTML(
                            item.title
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            item.content
                        ).replace(
                            /\n/g,
                            "<br>"
                        )}
                    </p>

                    <div class="small">
                        ${formatDate(
                            item.created_at
                        )}
                    </div>

                    <button
                        class="action-btn danger"
                        onclick="deleteKnowledge(${item.id})"
                    >
                        🗑️ Tirtir
                    </button>

                </div>

                `
            ).join("");

    } catch (error) {

        console.error(
            "LOAD KNOWLEDGE ERROR:",
            error
        );

        knowledgeList.innerHTML =
            `
            ❌ Knowledge lama soo qaadi karin.
            <br>
            <small>
                ${escapeHTML(error.message)}
            </small>
            `;
    }
}


/* =====================================================
   ADD KNOWLEDGE
===================================================== */

if (knowledgeForm) {

    knowledgeForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const title =
                document
                    .getElementById("knowledgeTitle")
                    .value
                    .trim();

            const content =
                document
                    .getElementById("knowledgeContent")
                    .value
                    .trim();

            if (!title || !content) {

                showStatus(
                    "Fadlan geli cinwaan iyo qoraalka knowledge-ka."
                );

                return;
            }

            try {

                const response =
                    await fetch(
                        `${API}/api/admin/knowledge`,
                        {
                            method: "POST",

                            headers:
                                authHeaders(true),

                            body:
                                JSON.stringify({
                                    title,
                                    content
                                })
                        }
                    );

                const data =
                    await getResponseData(
                        response
                    );

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Knowledge lama kaydin."
                    );
                }

                knowledgeForm.reset();

                await loadKnowledge();

                showStatus(
                    "✅ Knowledge waa la kaydiyay.",
                    "success"
                );

            } catch (error) {

                console.error(
                    "ADD KNOWLEDGE ERROR:",
                    error
                );

                showStatus(
                    error.message ||
                    "Knowledge lama kaydin."
                );
            }
        }
    );
}


/* =====================================================
   DELETE KNOWLEDGE
===================================================== */

async function deleteKnowledge(id) {

    if (
        !confirm(
            "Ma hubtaa inaad knowledge-kan tirtirayso?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API}/api/admin/knowledge/${id}`,
                {
                    method: "DELETE",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Knowledge lama tirtiri karin."
            );
        }

        await loadKnowledge();

        showStatus(
            "✅ Knowledge waa la tirtiray.",
            "success"
        );

    } catch (error) {

        console.error(
            "DELETE KNOWLEDGE ERROR:",
            error
        );

        showStatus(
            error.message ||
            "Delete failed."
        );
    }
}


/* =====================================================
   DELETE USER CHATS
===================================================== */

async function deleteUserChats(id) {

    if (
        !confirm(
            "Ma hubtaa inaad tirtirayso chat history-ga user-kan?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API}/api/admin/users/${id}/chats`,
                {
                    method: "DELETE",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Chat history lama tirtiri karin."
            );
        }

        await loadUsers();
        await loadChats();

        showStatus(
            "✅ Chat history-ga user-ka waa la tirtiray.",
            "success"
        );

    } catch (error) {

        console.error(
            "DELETE USER CHATS ERROR:",
            error
        );

        showStatus(
            error.message ||
            "Delete failed."
        );
    }
}


/* =====================================================
   DELETE USER
===================================================== */

async function deleteUser(id) {

    if (
        !confirm(
            "⚠️ Ma hubtaa inaad user-kan tirtirayso?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API}/api/admin/users/${id}`,
                {
                    method: "DELETE",

                    headers:
                        authHeaders()
                }
            );

        const data =
            await getResponseData(
                response
            );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "User lama tirtiri karin."
            );
        }

        await loadUsers();
        await loadChats();

        showStatus(
            "✅ User-ka waa la tirtiray.",
            "success"
        );

    } catch (error) {

        console.error(
            "DELETE USER ERROR:",
            error
        );

        showStatus(
            error.message ||
            "Delete failed."
        );
    }
}


/* =====================================================
   DELETE ALL CHATS
===================================================== */

const deleteAllChatsBtn =
    document.getElementById(
        "deleteAllChatsBtn"
    );

if (deleteAllChatsBtn) {

    deleteAllChatsBtn.addEventListener(
        "click",
        async function() {

            if (
                !confirm(
                    "⚠️ Dhammaan Chat History ma tirtirtaa?"
                )
            ) {
                return;
            }

            try {

                const response =
                    await fetch(
                        `${API}/api/admin/chats`,
                        {
                            method: "DELETE",

                            headers:
                                authHeaders()
                        }
                    );

                const data =
                    await getResponseData(
                        response
                    );

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Chats lama tirtiri karin."
                    );
                }

                await loadUsers();
                await loadChats();

                showStatus(
                    "✅ Dhammaan chats waa la tirtiray.",
                    "success"
                );

            } catch (error) {

                console.error(
                    "DELETE ALL CHATS ERROR:",
                    error
                );

                showStatus(
                    error.message ||
                    "Delete failed."
                );
            }
        }
    );
}


/* =====================================================
   BUTTONS
===================================================== */

const usersBtn =
    document.getElementById("usersBtn");

if (usersBtn) {

    usersBtn.addEventListener(
        "click",
        loadUsers
    );
}


const chatsBtn =
    document.getElementById("chatsBtn");

if (chatsBtn) {

    chatsBtn.addEventListener(
        "click",
        loadChats
    );
}


const knowledgeBtn =
    document.getElementById(
        "knowledgeBtn"
    );

if (knowledgeBtn) {

    knowledgeBtn.addEventListener(

/* =====================================================
   LOGOUT
===================================================== */

const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );

if (logoutBtn) {

    logoutBtn.addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                TOKEN_KEY
            );

            adminToken = null;

            showLogin();

            clearStatus();

            if (loginForm) {
                loginForm.reset();
            }
        }
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
        ? ""
        : String(value);

    return div.innerHTML;
}


/* =====================================================
   DATE
===================================================== */

function formatDate(date) {

    if (!date) {
        return "";
    }

    try {

        return new Date(date)
            .toLocaleString(
                "so-SO",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

    } catch {

        return String(date);
    }
}
