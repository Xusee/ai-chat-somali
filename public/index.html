<!DOCTYPE html>
<html lang="so">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NASIIB BUSINESS CENTER</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f7f7f8;

            color: #202123;

            min-height: 100vh;
        }


        /* =================================================
           HEADER
        ================================================= */

        header {

            background: #202123;

            color: white;

            padding: 16px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .logo {

            font-size: 20px;

            font-weight: bold;
        }

        .header-right {

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .user-name {

            font-size: 14px;

            opacity: .9;
        }


        /* =================================================
           AUTH CONTAINER
        ================================================= */

        #authSection {

            min-height: calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px 15px;
        }

        .auth-card {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.10);
        }

        .auth-logo {

            text-align: center;

            margin-bottom: 20px;
        }

        .auth-logo .icon {

            font-size: 48px;

            margin-bottom: 8px;
        }

        .auth-logo h1 {

            font-size: 24px;

            color: #10a37f;
        }

        .auth-logo p {

            color: #666;

            margin-top: 7px;

            font-size: 14px;
        }


        /* =================================================
           TABS
        ================================================= */

        .auth-tabs {

            display: flex;

            background: #f1f1f1;

            padding: 4px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .auth-tab {

            flex: 1;

            border: none;

            background: transparent;

            color: #555;

            padding: 11px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;
        }

        .auth-tab.active {

            background: #10a37f;

            color: white;
        }


        /* =================================================
           FORM
        ================================================= */

        .form-group {

            margin-bottom: 15px;
        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }

        .form-group input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {

            border-color: #10a37f;

            box-shadow:
                0 0 0 3px
                rgba(16,163,127,.12);
        }


        /* =================================================
           BUTTON
        ================================================= */

        .main-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #10a37f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .main-button:hover {

            background: #0b8064;
        }

        .main-button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        /* =================================================
           MESSAGES
        ================================================= */

        #messageBox {

            display: none;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 15px;

            font-size: 14px;

            line-height: 1.5;
        }

        #messageBox.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;
        }

        #messageBox.success {

            display: block;

            background: #dcfce7;

            color: #166534;
        }


        /* =================================================
           CHAT SECTION
        ================================================= */

        #chatSection {

            display: none;

            max-width: 1000px;

            margin: auto;

            padding: 20px;
        }

        .chat-card {

            background: white;

            border-radius: 16px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.07);

            overflow: hidden;
        }

        .chat-header {

            padding: 18px;

            border-bottom:
                1px solid #eee;

            font-weight: bold;

            font-size: 18px;
        }

        #chatMessages {

            min-height: 400px;

            max-height: 60vh;

            overflow-y: auto;

            padding: 20px;
        }

        .message {

            margin-bottom: 15px;

            display: flex;
        }

        .message.user {

            justify-content: flex-end;
        }

        .message.ai {

            justify-content: flex-start;
        }

        .bubble {

            max-width: 80%;

            padding: 12px 15px;

            border-radius: 14px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .message.user .bubble {

            background: #10a37f;

            color: white;

            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {

            background: #f1f1f1;

            color: #202123;

            border-bottom-left-radius: 4px;
        }


        /* =================================================
           CHAT INPUT
        ================================================= */

        .chat-input-area {

            border-top:
                1px solid #eee;

            padding: 15px;

            display: flex;

            gap: 10px;
        }

        #messageInput {

            flex: 1;

            resize: none;

            min-height: 48px;

            max-height: 130px;

            padding: 13px;

            border:
                1px solid #ccc;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        #messageInput:focus {

            border-color: #10a37f;
        }

        #sendButton {

            width: 100px;

            border: none;

            border-radius: 10px;

            background: #10a37f;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        #sendButton:disabled {

            opacity: .6;
        }


        /* =================================================
           CHAT CONTROLS
        ================================================= */

        .chat-controls {

            display: flex;

            gap: 8px;

            padding: 0 15px 15px;
        }

        .control-button {

            padding: 9px 13px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #475569;

            color: white;
        }

        .control-button.danger {

            background: #dc2626;
        }


        /* =================================================
           LOADING
        ================================================= */

        .typing {

            color: #777;

            font-style: italic;

            padding: 10px;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            header {

                padding: 13px 15px;
            }

            .logo {

                font-size: 16px;
            }

            .user-name {

                display: none;
            }

            .auth-card {

                padding: 22px 18px;

                border-radius: 14px;
            }

            .auth-logo h1 {

                font-size: 21px;
            }

            #chatSection {

                padding: 10px;
            }

            #chatMessages {

                min-height: 55vh;

                padding: 12px;
            }

            .bubble {

                max-width: 90%;
            }

            .chat-input-area {

                padding: 10px;
            }

            #sendButton {

                width: 70px;
            }

            .chat-controls {

                flex-wrap: wrap;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        🤖 NASIIB BUSINESS CENTER
    </div>

    <div class="header-right">

        <span
            id="userName"
            class="user-name"
        ></span>

        <button
            id="headerLogout"
            class="control-button"
            style="display:none;"
        >
            🚪 Ka bax
        </button>

    </div>

</header>


<!-- =====================================================
     AUTH SECTION
===================================================== -->

<section id="authSection">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="icon">
                🤖
            </div>

            <h1>
                NASIIB BUSINESS CENTER
            </h1>

            <p>
                AI Chat Somali
            </p>

        </div>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="auth-tab active"
                type="button"
            >
                Soo gal
            </button>

            <button
                id="registerTab"
                class="auth-tab"
                type="button"
            >
                Akawn cusub
            </button>

        </div>


        <!-- MESSAGE -->

        <div id="messageBox"></div>


        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form
            id="loginForm"
        >

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Geli email-kaaga"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Geli password-kaaga"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="main-button"
                type="submit"
            >
                🔐 Soo gal
            </button>

        </form>


        <!-- =================================================
             REGISTER FORM
        ================================================= -->

        <form
            id="registerForm"
            style="display:none;"
        >

            <div class="form-group">

                <label for="registerName">
                    Magaca
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Geli magacaaga"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Geli email-kaaga"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Ugu yaraan 6 xaraf"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword2">
                    Ku celi Password
                </label>

                <input
                    type="password"
                    id="registerPassword2"
                    placeholder="Mar kale geli password-ka"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                id="registerButton"
                class="main-button"
                type="submit"
            >
                📝 Soo gal akoon cusub
            </button>

        </form>

    </div>

</section>



<!-- =====================================================
     CHAT SECTION
===================================================== -->

<section id="chatSection">

    <div class="chat-card">


        <div class="chat-header">

            💬 AI Chat Somali

        </div>


        <div id="chatMessages">

            <div class="message ai">

                <div class="bubble">

                    👋 Ku soo dhowow NASIIB BUSINESS CENTER.

                    <br><br>

                    Waxaan ahay AI Chat Somali.
                    Maxaan maanta kaa caawin karaa?

                </div>

            </div>

        </div>


        <div
            id="typing"
            class="typing"
            style="display:none;"
        >
            🤖 AI ayaa qoraya...
        </div>


        <!-- INPUT -->

        <div class="chat-input-area">

            <textarea
                id="messageInput"
                placeholder="Halkan ku qor fariinta..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                type="button"
            >
                ➤ Dir
            </button>

        </div>


        <!-- CONTROLS -->

        <div class="chat-controls">

            <button
                id="clearChatsButton"
                class="control-button danger"
                type="button"
            >
                🗑️ Tirtir Chat
            </button>

            <button
                id="chatLogout"
                class="control-button"
                type="button"
            >
                🚪 Ka bax
            </button>

        </div>

    </div>

</section>



<script>

/* =====================================================
   CONFIG
===================================================== */

const API = window.location.origin;

const TOKEN_KEY = "token";

const USER_KEY = "user";


/* =====================================================
   ELEMENTS
===================================================== */

const authSection =
    document.getElementById(
        "authSection"
    );

const chatSection =
    document.getElementById(
        "chatSection"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const registerForm =
    document.getElementById(
        "registerForm"
    );

const loginTab =
    document.getElementById(
        "loginTab"
    );

const registerTab =
    document.getElementById(
        "registerTab"
    );

const messageBox =
    document.getElementById(
        "messageBox"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const registerButton =
    document.getElementById(
        "registerButton"
    );

const userName =
    document.getElementById(
        "userName"
    );

const headerLogout =
    document.getElementById(
        "headerLogout"
    );

const chatLogout =
    document.getElementById(
        "chatLogout"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const typing =
    document.getElementById(
        "typing"
    );

const clearChatsButton =
    document.getElementById(
        "clearChatsButton"
    );


/* =====================================================
   STORAGE
===================================================== */

let token =
    localStorage.getItem(
        TOKEN_KEY
    );

let currentUser = null;


try {

    currentUser =
        JSON.parse(
            localStorage.getItem(
                USER_KEY
            )
        );

} catch {

    currentUser = null;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type = "error"
) {

    messageBox.textContent =
        message;

    messageBox.className =
        type;

    messageBox.style.display =
        "block";
}


function clearMessage() {

    messageBox.textContent = "";

    messageBox.className = "";

    messageBox.style.display =
        "none";
}


/* =====================================================
   AUTH TABS
===================================================== */

loginTab.addEventListener(
    "click",
    function() {

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

        loginForm.style.display =
            "block";

        registerForm.style.display =
            "none";

        clearMessage();

    }
);


registerTab.addEventListener(
    "click",
    function() {

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        registerForm.style.display =
            "block";

        loginForm.style.display =
            "none";

        clearMessage();

    }
);


/* =====================================================
   SAVE LOGIN
===================================================== */

function saveSession(
    data
) {

    token =
        data.token;

    currentUser =
        data.user;

    localStorage.setItem(
        TOKEN_KEY,
        token
    );

    localStorage.setItem(
        USER_KEY,
        JSON.stringify(
            currentUser
        )
    );
}


/* =====================================================
   SHOW CHAT
===================================================== */

function showChat() {

    authSection.style.display =
        "none";

    chatSection.style.display =
        "block";

    headerLogout.style.display =
        "block";

    if (currentUser) {

        userName.textContent =
            currentUser.name ||
            currentUser.email;

    }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    authSection.style.display =
        "flex";

    chatSection.style.display =
        "none";

    headerLogout.style.display =
        "none";

    userName.textContent =
        "";

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();

        const email =
            document
                .getElementById(
                    "loginEmail"
                )
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        if (!email || !password) {

            showMessage(
                "Fadlan geli email iyo password."
            );

            return;
        }


        try {

            loginButton.disabled =
                true;

            loginButton.textContent =
                "⏳ Soo galaya...";


            const response =
                await fetch(
                    `${API}/api/login`,
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email,
                                password
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Soo gelitaanku wuu fashilmay."
                );

            }


            if (!data.token) {

                throw new Error(
                    "Token lama helin."
                );

            }


            if (!data.user) {

                throw new Error(
                    "Xogta user-ka lama helin."
                );

            }


            /* =========================================
               SAVE TOKEN
            ========================================= */

            saveSession(data);


            /* =========================================
               ADMIN
            ========================================= */

            if (
                data.user.role ===
                "admin"
            ) {

                window.location.href =
                    "/admin/";

                return;

            }


            /* =========================================
               USER
            ========================================= */

            showChat();

            await loadChatHistory();


        } catch(error) {

            console.error(
                "LOGIN ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Server error ayaa dhacay."
            );

        } finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "🔐 Soo gal";

        }

    }
);


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const name =
            document
                .getElementById(
                    "registerName"
                )
                .value
                .trim();

        const email =
            document
                .getElementById(
                    "registerEmail"
                )
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;

        const password2 =
            document
                .getElementById(
                    "registerPassword2"
                )
                .value;


        /* =========================================
           VALIDATION
        ========================================= */

        if (
            !name ||
            !email ||
            !password ||
            !password2
        ) {

            showMessage(
                "Fadlan buuxi dhammaan meelaha."
            );

            return;

        }


        if (
            password.length < 6
        ) {

            showMessage(
                "Password-ku waa inuu ahaadaa ugu yaraan 6 xaraf."
            );

            return;

        }


        if (
            password !==
            password2
        ) {

            showMessage(
                "Labada password isma laha."
            );

            return;

        }


        try {

            registerButton.disabled =
                true;

            registerButton.textContent =
                "⏳ Akoon ayaa la sameynayaa...";


            const response =
                await fetch(
                    `${API}/api/register`,
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name,

                                email,

                                password

                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Register-ku wuu fashilmay."
                );

            }


            if (!data.token) {

                throw new Error(
                    "Token lama helin."
                );

            }


            if (!data.user) {

                throw new Error(
                    "Xogta user-ka lama helin."
                );

            }


            /* =========================================
               SAVE SESSION
            ========================================= */

            saveSession(data);


            /* =========================================
               ADMIN
            ========================================= */

            if (
                data.user.role ===
                "admin"
            ) {

                window.location.href =
                    "/admin/";

                return;

            }


            /* =========================================
               USER
            ========================================= */

            showChat();


            chatMessages.innerHTML = `

                <div class="message ai">

                    <div class="bubble">

                        👋 Soo dhowow
                        ${escapeHTML(data.user.name)}!

                        <br><br>

                        Akoonkaaga si guul leh ayaa loo sameeyay.

                        <br><br>

                        Maxaan kaa caawin karaa?

                    </div>

                </div>

            `;


        } catch(error) {

            console.error(
                "REGISTER ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Server error ayaa dhacay."
            );

        } finally {

            registerButton.disabled =
                false;

            registerButton.textContent =
                "📝 Soo gal akoon cusub";

        }

    }
);


/* =====================================================
   LOAD CHAT HISTORY
===================================================== */

async function loadChatHistory() {

    if (!token) return;


    try {

        const response =
            await fetch(
                `${API}/api/chats`,
                {

                    method:
                        "GET",

                    headers: {

                        Authorization:
                            `Bearer ${token}`

                    }

                }
            );


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            logout();

            return;

        }


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            return;

        }


        if (
            !Array.isArray(
                data.chats
            )
        ) {

            return;

        }


        if (
            data.chats.length === 0
        ) {

            return;

        }


        chatMessages.innerHTML =
            "";


        data.chats.forEach(
            chat => {

                addMessage(
                    chat.message,
                    "user"
                );

                addMessage(
                    chat.response,
                    "ai"
                );

            }
        );


        scrollChat();

    } catch(error) {

        console.error(
            "CHAT HISTORY ERROR:",
            error
        );

    }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    text,
    type
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        `message ${type}`;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.textContent =
        text || "";


    wrapper.appendChild(
        bubble
    );


    chatMessages.appendChild(
        wrapper
    );


    scrollChat();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat() {

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


/* =====================================================
   SEND CHAT
===================================================== */

async function sendMessage() {

    const message =
        messageInput
            .value
            .trim();


    if (!message) {

        return;

    }


    if (!token) {

        showLogin();

        return;

    }


    addMessage(
        message,
        "user"
    );


    messageInput.value =
        "";


    sendButton.disabled =
        true;

    messageInput.disabled =
        true;

    typing.style.display =
        "block";


    try {

        const response =
            await fetch(
                `${API}/chat`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message,

                            userId:
                                currentUser
                                ?
                                currentUser.id
                                :
                                null

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "AI jawaab ma bixin."
            );

        }


        addMessage(
            data.response ||
            "Jawaab lama helin.",
            "ai"
        );


    } catch(error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        addMessage(
            "❌ " +
            (
                error.message ||
                "Server error ayaa dhacay."
            ),
            "ai"
        );

    } finally {

        sendButton.disabled =
            false;

        messageInput.disabled =
            false;

        typing.style.display =
            "none";

        messageInput.focus();

    }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   DELETE CHAT HISTORY
===================================================== */

clearChatsButton.addEventListener(
    "click",
    async function() {

        if (!token) {

            return;

        }


        const confirmed =
            confirm(
                "Ma hubtaa inaad tirtirayso dhammaan Chat History-ga?"
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API}/api/chats`,
                    {

                        method:
                            "DELETE",

                        headers: {

                            Authorization:
                                `Bearer ${token}`

                        }

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Chat lama tirtirin."
                );

            }


            chatMessages.innerHTML = `

                <div class="message ai">

                    <div class="bubble">

                        🗑️ Chat History waa la tirtiray.

                    </div>

                </div>

            `;


        } catch(error) {

            alert(
                error.message ||
                "Server error."
            );

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        TOKEN_KEY
    );

    localStorage.removeItem(
        USER_KEY
    );


    token = null;

    currentUser = null;


    showLogin();


    loginForm.reset();

    registerForm.reset();

    clearMessage();


    chatMessages.innerHTML = `

        <div class="message ai">

            <div class="bubble">

                👋 Ku soo dhowow NASIIB BUSINESS CENTER.

                <br><br>

                Fadlan soo gal akoonkaaga.

            </div>

        </div>

    `;

}


/* =====================================================
   LOGOUT BUTTONS
===================================================== */

headerLogout.addEventListener(
    "click",
    logout
);

chatLogout.addEventListener(
    "click",
    logout
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
        ? ""
        : String(value);

    return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

if (
    token &&
    currentUser
) {

    if (
        currentUser.role ===
        "admin"
    ) {

        window.location.href =
            "/admin/";

    } else {

        showChat();

        loadChatHistory();

    }

} else {

    showLogin();

}

</script>
