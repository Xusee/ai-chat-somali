<!DOCTYPE html>
<html lang="so">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NASIIB BUSINESS CENTER</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #075985;
    color: white;
    padding: 16px 20px;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

input,
textarea,
button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-top: 8px;
    font-size: 16px;
}

button {
    background: #0284c7;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.secondary {
    background: #475569;
}

.danger {
    background: #dc2626;
}

#chatSection {
    display: none;
}

#messages {
    min-height: 400px;
    max-height: 65vh;
    overflow-y: auto;
    padding: 10px;
}

.message {
    padding: 13px 16px;
    margin: 10px 0;
    border-radius: 15px;
    white-space: normal;
    line-height: 1.6;
}

.message.user {
    background: #0284c7;
    color: white;
    margin-left: 15%;
}

.message.ai {
    background: #eef2f7;
    color: #172033;
    margin-right: 15%;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}

.user-info {
    margin-bottom: 15px;
}

.chat-tools {
    display: flex;
    gap: 8px;
}

.chat-tools button {
    width: auto;
}

.chat-input {
    display: flex;
    gap: 8px;
    align-items: end;
}

.chat-input textarea {
    flex: 1;
    resize: vertical;
}

.send {
    width: 70px;
}

.image-button {
    width: 55px;
}

#imageInput {
    display: none;
}

.small {
    color: #64748b;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.tabs button {
    width: auto;
}

@media(max-width:600px) {

    .container {
        padding: 10px;
    }

    .message.user {
        margin-left: 5%;
    }

    .message.ai {
        margin-right: 5%;
    }

    .chat-input {
        flex-wrap: wrap;
    }

    .chat-input textarea {
        width: 100%;
        flex-basis: 100%;
    }
}

</style>

</head>

<body>

<header>

<h1>🤖NASIIB BUSINESS CENTER</h1>

</header>

<div class="container">

<!-- ================================================= -->
<!-- LOGIN / REGISTER -->
<!-- ================================================= -->

<div id="loginSection">

<div class="card">

<h2>🔐 Gal Account</h2>

<form id="loginForm">

<input
    id="loginEmail"
    type="email"
    placeholder="Email"
    required
>

<input
    id="loginPassword"
    type="password"
    placeholder="Password"
    required
>

<button type="submit">
    🔐 Gal
</button>

</form>

</div>

<div class="card">

<h2>📝 Samee Account</h2>

<form id="registerForm">

<input
    id="registerName"
    type="text"
    placeholder="Magaca"
    required
>

<input
    id="registerEmail"
    type="email"
    placeholder="Email"
    required
>

<input
    id="registerPassword"
    type="password"
    placeholder="Password"
    minlength="6"
    required
>

<button type="submit">
    📝 Samee Account
</button>

</form>

</div>

</div>

<!-- ================================================= -->
<!-- CHAT -->
<!-- ================================================= -->

<div id="chatSection">

<div class="card">

<div class="user-info">

<strong id="userName"></strong>

<br>

<span
    id="userEmail"
    class="small"
></span>

</div>

<div class="chat-tools">

<button
    id="clearBtn"
    class="danger"
>
    🗑️ Tirtir Chat
</button>

<button
    id="logoutBtn"
    class="secondary"
>
    🚪 Ka bax
</button>

</div>

</div>

<div class="card">

<div id="messages"></div>

<form id="chatForm">

<div class="chat-input">

<button
    type="button"
    id="imageBtn"
    class="image-button"
    title="Geli sawir"
>
    📷
</button>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

<textarea
    id="messageInput"
    rows="2"
    placeholder="Su'aashaada qor..."
></textarea>

<button
    type="submit"
    class="send"
>
    ➤
</button>

</div>

</form>

</div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
